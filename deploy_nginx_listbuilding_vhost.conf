# =====================================================================
# SNAPSHOT of the LIVE nginx vhost — taken 2026-09-18 13:33 UTC
# Authoritative file: /etc/nginx/sites-enabled/listbuilding.eagleinfoservice.com
# (this copy is a disaster-recovery backup, NOT deployed from here; the
#  live file may have drifted since this snapshot — diff before relying)
# Includes: trailing-slash internal rewrite for /api/enrichment/enrich/
# (2026-09-18), enrich_global 50r/s cap, enrich_bulk per-IP, external_api.
# Pre-rewrite backup on server: *.backup.20260918_trailslash
# =====================================================================
server {
    server_name listbuilding.eagleinfoservice.com;
    
    # Enrichment rate-limit rejection: 429 (retryable) instead of nginx default 503 (fatal). 2026-07-28
    limit_req_status 429;
    error_page 429 = @rate_limited;
    
    # Prevent caching of index.html
    location = /index.html {
        root /var/www/lead-generation-platform/frontend;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }
    
    # Frontend static files
    location / {
        root /var/www/lead-generation-platform/frontend;
        try_files $uri $uri/ /index.html;
        
        # Cache static assets
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
    # list-building.html was a legacy duplicate UI (removed 2026-07-29).
    # Redirect old links/bookmarks to the main app instead of a 404.
    location /list-building {
        return 301 /;
    }
    # MCP documentation oracle proxy (Phase 1D — added 2026-07-16)
    location /mcp {
        proxy_pass http://localhost:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # MCP uses streamable HTTP — buffering must be off
        proxy_buffering off;
        proxy_cache off;
        # MCP connections can be long-lived
        proxy_connect_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }
    # Trailing-slash alias for the enrich hot path (2026-09-18).
    # Clay sends /api/enrichment/enrich/ (with slash) on ~half its calls;
    # FastAPI answers those with a 307 redirect — a wasted extra round trip
    # per request. This exact-match location internally rewrites the URI to
    # the canonical path before proxying: no redirect, no client-side change.
    # limit_req + proxy settings are deliberately identical to the canonical
    # block below so slash traffic cannot bypass the enrich_global cap.
    # Revert: delete this block + `nginx -t && systemctl reload nginx`.
    location = /api/enrichment/enrich/ {
        limit_req zone=enrich_global burst=50 nodelay;
        proxy_pass http://localhost:8765/api/enrichment/enrich;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 600s;
    }
    # Enrichment hot-path aggregate rate limit (emergency OOM tourniquet 2026-07-27).
    # Keyed on $server_name (constant) so rotating-IP fleets can't bypass per-IP limits.
    # Tunable: lower the rate to shed more load; remove this block to revert.
    location /api/enrichment/enrich {
        limit_req zone=enrich_global burst=50 nodelay;
        proxy_pass http://localhost:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 600s;
    }
    # 429 body for rate-limited enrichment requests (503->429 fix 2026-07-28)
    location @rate_limited {
        add_header Retry-After "3" always;
        default_type application/json;
        return 429 '{"success":false,"error":"rate_limited","message":"Enrichment API at capacity, please retry shortly."}';
    }
    # External API clients (Clay/scripts/MCP wrappers): modest per-IP tourniquet.
    # 429 JSON body inherited from the server-level @rate_limited handler.
    # Added 2026-08-30 with the /api/external/scraper surface.
    location /api/external/ {
        limit_req zone=external_api burst=20 nodelay;
        proxy_pass http://localhost:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
    # API-key-opened enrichment surface (2026-09-07): modest per-IP tourniquet for
    # bulk/flow/search/job endpoints. The single-row hot path /api/enrichment/enrich
    # keeps its own enrich_global block above (longest prefix match wins).
    location /api/enrichment/ {
        limit_req zone=enrich_bulk burst=40 nodelay;
        proxy_pass http://localhost:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }
    # API proxy to backend (with SSE support)
    location /api/ {
        proxy_pass http://localhost:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # Prevent caching of API responses
        proxy_buffering off;
        proxy_cache off;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        proxy_connect_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }
    gzip on;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript text/csv application/csv;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 6;
    
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    
    client_max_body_size 100M;
    client_body_timeout 300s;
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/listbuilding.eagleinfoservice.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/listbuilding.eagleinfoservice.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
server {
    if ($host = listhosting.eagleinfoservice.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot
    server_name listbuilding.eagleinfoservice.com;
    
    listen 80;
    return 404; # managed by Certbot
}
